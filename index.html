<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="LetterArchive – ett personligt digitalt arkiv för historiska försändelser."
    >
    <title>LetterArchive – Arkiv</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app" class="site-main" tabindex="-1">
      <p class="loading" role="status">Öppnar arkivet…</p>
    </main>

    <footer class="site-footer">
      <p>Ett personligt arkiv för försändelser och minnen.</p>
    </footer>

    <div
      id="image-viewer"
      class="image-viewer"
      role="dialog"
      aria-modal="true"
      aria-label="Förstorad originalbild"
      hidden
    >
      <button class="viewer-close" type="button" aria-label="Stäng bildvisaren">
        Stäng <span aria-hidden="true">×</span>
      </button>
      <div class="viewer-content"></div>
    </div>
  </body>
</html>
